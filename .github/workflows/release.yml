name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - run: npm run compile
      - run: xvfb-run -a npm test
      - run: npx vsce package --out fusesoc-editor-support.vsix
      - run: npx vsce publish --packagePath fusesoc-editor-support.vsix --oidc
      - name: Attach vsix to GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" fusesoc-editor-support.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
